apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'


def webSourceDir = file("../../www")
def generatedWebAssetsDir = file("$buildDir/generated/web-assets")
def releaseSigningFile = rootProject.file('release-signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

android {
    namespace "com.hikariatelier.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.hikariatelier.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.3"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (releaseSigningFile.exists()) {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-runtime-debug"
            resValue "string", "app_name", "Edit:RiN Dev"
        }
        release {
            debuggable false
            if (releaseSigningFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/{LICENSE.md,LICENSE-notice.md}'
        }
    }

    sourceSets {
        main {
            assets.srcDir generatedWebAssetsDir
            assets.srcDir "$buildDir/generated/license-assets"
        }
    }
}

apply from: 'release-notices.gradle'

def syncWebAssets = tasks.register("syncWebAssets", Sync) {
    from(webSourceDir) {
        include 'p5_runner.html'
        include 'p5.min.js'
        include 'p5-v1.min.js'
        include 'p5-v2.min.js'
        include 'p5.sound.min.js'
        include 'samples/*.js'
    }
    into new File(generatedWebAssetsDir, "public")
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(syncWebAssets)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.6"
    implementation "androidx.documentfile:documentfile:1.0.1"

    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
