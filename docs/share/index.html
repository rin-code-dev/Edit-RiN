<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit:RiN Web Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0F111A;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    #top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 100;
    }
    .badge {
      pointer-events: auto;
      background: rgba(15, 17, 26, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #A8C7FA;
      text-decoration: none;
      transition: background 0.2s;
    }
    .badge:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    #error-msg {
      display: none;
      max-width: 80%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.5/p5.min.js"></script>
</head>
<body>
  <div id="top-bar">
    <span class="badge">Edit:RiN</span>
    <a class="badge" href="https://github.com/rin-code-dev/Edit-RiN" target="_blank" rel="noopener">GitHub</a>
  </div>

  <div id="canvas-container">
    <div id="error-msg"></div>
  </div>

  <script>
    async function decompressDeflate(bytes) {
      if (typeof DecompressionStream !== 'undefined') {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        return new Response(stream).text();
      }
      throw new Error('DecompressionStream not supported in this browser.');
    }

    function base64UrlToBytes(base64url) {
      let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function init() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash || window.location.search);
      const encodedCode = params.get('c') || params.get('code');

      if (!encodedCode) {
        showError('No code specified in URL.\nUsage: .../share/#c=<compressed_base64_code>');
        return;
      }

      try {
        const bytes = base64UrlToBytes(encodedCode);
        const code = await decompressDeflate(bytes);

        // Execute sketch
        const script = document.createElement('script');
        script.textContent = code;
        document.body.appendChild(script);
      } catch (err) {
        showError('Failed to decode or run sketch:\n' + (err.message || String(err)));
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
