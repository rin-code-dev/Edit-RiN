<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edit:RiN Web Viewer</title>
  <style>
    :root {
      --bg-base: #08090e;
      --bg-gradient: radial-gradient(circle at 50% 40%, #141724 0%, #08090e 100%);
      --surface-glass: rgba(18, 21, 33, 0.72);
      --surface-glass-heavy: rgba(20, 24, 38, 0.90);
      --border-glass: rgba(255, 255, 255, 0.10);
      --border-glass-bright: rgba(255, 255, 255, 0.20);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-glow: rgba(139, 92, 246, 0.32);
      --accent-cyan-glow: rgba(6, 182, 212, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace;
      --safe-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      --safe-top: max(16px, env(safe-area-inset-top, 16px));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-ui);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Ambient lighting aura behind canvas */
    #ambient-glow {
      position: fixed;
      width: 75vw;
      height: 75vh;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(6, 182, 212, 0.06) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      animation: pulse-aura 8s infinite alternate ease-in-out;
    }
    @keyframes pulse-aura {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* Canvas styling */

    #sketch-frame {
      width: 100%;
      height: 100%;
      border: 0;
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* ==========================================================================
       Top Navigation Bar
       ========================================================================== */
    #top-bar {
      position: fixed;
      top: var(--safe-top);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s ease;
      pointer-events: none;
    }
    #top-bar > * {
      pointer-events: auto;
    }

    .brand-pill {
      background: var(--surface-glass);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
    }
    .brand-pill:hover {
      border-color: var(--border-glass-bright);
      background: rgba(25, 30, 48, 0.8);
    }
    .brand-pill:active {
      transform: scale(0.97);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse-dot 2.2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.14);
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(6, 182, 212, 0.28);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-btn {
      background: var(--surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      border-radius: 9999px;
      height: 38px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .top-btn:hover {
      color: #ffffff;
      border-color: var(--border-glass-bright);
      background: rgba(255, 255, 255, 0.10);
      transform: translateY(-1px);
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    .top-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .btn-get-app {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid rgba(139, 92, 246, 0.45);
      color: #ffffff;
    }
    .btn-get-app:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(6, 182, 212, 0.4));
      border-color: rgba(139, 92, 246, 0.7);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* ==========================================================================
       Floating Control Bar (Preserved & Refined)
       ========================================================================== */
    #control-bar {
      position: fixed;
      bottom: var(--safe-bottom);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-glass);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--border-glass);
      padding: 6px 10px;
      border-radius: 9999px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75), 0 0 24px rgba(139, 92, 246, 0.15);
      z-index: 1000;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ctrl-btn {
      position: relative;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateY(-2px);
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }
    .ctrl-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.45), rgba(6, 182, 212, 0.35));
      border: 1px solid rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 14px var(--accent-glow);
    }
    .ctrl-btn.recording {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      animation: pulse-rec 1.2s infinite ease-in-out;
    }
    @keyframes pulse-rec {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 14px rgba(239, 68, 68, 0.6); }
    }

    .ctrl-btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }
    .ctrl-btn:hover svg {
      transform: scale(1.08);
    }

    .badge-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--border-glass);
      margin: 0 4px;
    }

    /* Tooltip styling */
    .ctrl-btn[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 17, 27, 0.96);
      border: 1px solid var(--border-glass-bright);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      animation: tip-in 0.15s ease-out;
      z-index: 2000;
    }
    @keyframes tip-in {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ==========================================================================
       Parameters Panel (Adaptive: Floating Popover on Desktop, Bottom Sheet on Mobile)
       ========================================================================== */
    #params-panel {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 64px);
      right: 24px;
      width: 340px;
      max-width: calc(100vw - 32px);
      max-height: 64vh;
      background: var(--surface-glass-heavy);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--border-glass-bright);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 25px rgba(139, 92, 246, 0.15);
      z-index: 1100;
      display: none;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      transform-origin: bottom right;
      animation: panel-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #params-panel.visible {
      display: flex;
    }
    @keyframes panel-pop {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .sheet-handle {
      display: none;
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 0 auto 8px auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-glass);
    }
    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .panel-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.16);
      border: 1px solid rgba(6, 182, 212, 0.32);
      padding: 1px 7px;
      border-radius: 12px;
    }
    .panel-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .panel-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--border-glass-bright);
    }

    .param-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      padding: 12px 14px;
      border-radius: 14px;
      transition: border-color 0.2s;
    }
    .param-item:hover {
      border-color: var(--border-glass-bright);
    }
    .param-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .param-label {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .param-var {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }
    .param-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.24);
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 0 3px var(--accent-purple);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.18);
      transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 24px;
    }
    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    input:checked + .slider-toggle {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
    }
    input:checked + .slider-toggle:before {
      transform: translateX(20px);
    }

    /* ==========================================================================
       Code Modal (IDE & Playground)
       ========================================================================== */
    #code-modal {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 14, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
      animation: modal-fade 0.2s ease-out;
    }
    #code-modal.visible {
      display: flex;
    }
    @keyframes modal-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      width: 100%;
      max-width: 800px;
      max-height: 86vh;
      background: #0d0f17;
      border: 1px solid var(--border-glass-bright);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.9), 0 0 30px rgba(139, 92, 246, 0.18);
      animation: modal-card-in 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modal-card-in {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-glass);
      background: #111420;
    }
    .modal-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .modal-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .modal-tab-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.16);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-run-code {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #ffffff;
      padding: 6px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 14px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn-run-code:hover {
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }
    .btn-run-code:active {
      transform: scale(0.96);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--border-glass-bright);
    }

    .editor-wrapper {
      position: relative;
      display: flex;
      flex: 1;
      height: 58vh;
      overflow: hidden;
      background: #090b12;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
    }
    .code-lines {
      padding: 16px 12px 16px 16px;
      text-align: right;
      color: #475569;
      user-select: none;
      border-right: 1px solid var(--border-glass);
      background: #0b0d16;
      min-width: 44px;
    }
    #code-editor {
      flex: 1;
      padding: 16px 20px;
      color: #e2e8f0;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }

    /* ==========================================================================
       Loading Indicator, Toast, and Notifications
       ========================================================================== */
    #loading-indicator {
      position: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 500;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .loader-ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent-cyan);
      border-right-color: var(--accent-purple);
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: var(--surface-glass-heavy);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass-bright);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 9999px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #banner-notice {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 68px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 900;
      pointer-events: none;
    }

    /* Mobile Adaptations */
    @media (max-width: 640px) {
      #params-panel {
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100%;
        border-radius: 24px 24px 0 0;
        max-height: 72vh;
        padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      }
      .sheet-handle {
        display: block;
      }
      .modal-card {
        max-height: 92vh;
        border-radius: 18px;
      }
      .top-btn span {
        display: none;
      }
      .top-btn {
        padding: 0 10px;
      }
      #control-bar {
        padding: 5px 8px;
        gap: 2px;
      }
      .ctrl-btn {
        width: 40px;
        height: 40px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    let globalCode = '';
    let isRunning = true;
    let autoHideTimer = null;
    let toastTimer = null;
    let isRecording = false;
    let runnerFrame = null;
    let runnerPort = null;
    let runnerTimer = null;

    // Default interactive demo sketch if no #c= parameter is provided
    const DEMO_SKETCH = `// @rin number particleCount "Particles" 30 180 80 10
// @rin number speed "Speed" 0.2 3.0 1.0 0.1
// @rin color tintColor "Glow Color" #38BDF8
// @rin boolean trails "Motion Blur" true

var points = [];

function setup() {
  var s = min(windowWidth * 0.9, windowHeight * 0.8, 520);
  createCanvas(s, s);
  points = [];
  for (var i = 0; i < 200; i++) {
    points.push({
      x: random(width),
      y: random(height),
      vx: random(-1.2, 1.2),
      vy: random(-1.2, 1.2),
      size: random(2, 5)
    });
  }
}

function draw() {
  if (rinParams.trails) {
    background(8, 9, 14, 25);
  } else {
    background(8, 9, 14);
  }

  stroke(rinParams.tintColor);
  fill(rinParams.tintColor);

  var n = min(rinParams.particleCount, points.length);
  for (var i = 0; i < n; i++) {
    var p = points[i];
    p.x += p.vx * rinParams.speed;
    p.y += p.vy * rinParams.speed;
    if (p.x < 0 || p.x > width) p.vx *= -1;
    if (p.y < 0 || p.y > height) p.vy *= -1;

    circle(p.x, p.y, p.size);
    for (var j = i + 1; j < n; j++) {
      var p2 = points[j];
      var d = dist(p.x, p.y, p2.x, p2.y);
      if (d < 70) {
        strokeWeight(map(d, 0, 70, 1.5, 0));
        line(p.x, p.y, p2.x, p2.y);
      }
    }
  }
}`;

    // The sketch runs in an opaque-origin sandbox. Keep this runner inside index.html
    // so a single Pages file update publishes the complete viewer.
    function sketchRunner() {
      let port;
      let instance;
      let recorder;
      let stream;
      let recordingTimer;
      let chunks = [];
      let recordingFailed = false;
      const send = (type, extra = {}) => port?.postMessage({ type, ...extra });
      const canvas = () => document.querySelector('canvas');
      const stopTracks = () => {
        stream?.getTracks().forEach(track => track.stop());
        stream = null;
      };

      function record() {
        if (recorder?.state === 'recording') {
          recorder.stop();
          return;
        }
        if (!canvas()?.captureStream || typeof MediaRecorder === 'undefined') {
          send('error', { message: 'Video recording is not supported' });
          return;
        }
        try {
          stream = canvas().captureStream(30);
          const mime = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4']
            .find(type => MediaRecorder.isTypeSupported(type));
          recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          chunks = [];
          recordingFailed = false;
          recorder.ondataavailable = event => {
            if (event.data?.size) chunks.push(event.data);
          };
          recorder.onerror = () => {
            recordingFailed = true;
            clearTimeout(recordingTimer);
            stopTracks();
            send('error', { message: 'Video recording failed' });
            send('recording', { active: false });
          };
          recorder.onstop = () => {
            clearTimeout(recordingTimer);
            stopTracks();
            send('recording', { active: false });
            if (recordingFailed) return;
            if (!chunks.length) {
              send('error', { message: 'No video data was captured' });
              return;
            }
            const type = recorder.mimeType || chunks[0].type || 'video/webm';
            send('download', { blob: new Blob(chunks, { type }), mediaType: type, kind: 'video' });
            chunks = [];
          };
          recorder.start();
          send('recording', { active: true });
          recordingTimer = setTimeout(() => {
            if (recorder.state === 'recording') recorder.stop();
          }, 5000);
        } catch (_) {
          stopTracks();
          send('error', { message: 'Video recording is not supported' });
          send('recording', { active: false });
        }
      }

      function handle(event) {
        const data = event.data || {};
        try {
          if (data.type === 'start') {
            if (typeof p5 === 'undefined') throw new Error('p5.js could not be loaded');
            p5.prototype.registerMethod('afterSetup', () => send('started'));
            window.rinParams = data.params;
            const script = document.createElement('script');
            script.textContent = `${data.code}\n//# sourceURL=sketch.js`;
            document.body.appendChild(script);
            instance = new p5();
          } else if (data.type === 'params') {
            Object.assign(window.rinParams, data.params);
            if (instance && !instance.isLooping()) instance.redraw();
          } else if (data.type === 'pause') {
            instance?.noLoop();
          } else if (data.type === 'play') {
            instance?.loop();
          } else if (data.type === 'snapshot') {
            if (!canvas()) throw new Error('No canvas available');
            canvas().toBlob(blob => {
              if (blob) send('download', { blob, mediaType: 'image/png', kind: 'snapshot' });
              else send('error', { message: 'Snapshot failed' });
            }, 'image/png');
          } else if (data.type === 'record') {
            record();
          }
        } catch (error) {
          send('error', { message: error.message || String(error) });
        }
      }

      window.addEventListener('error', event => send('error', { message: event.message || 'Sketch error' }));
      window.addEventListener('unhandledrejection', event =>
        send('error', { message: String(event.reason?.message || event.reason || 'Sketch error') }));
      window.addEventListener('message', event => {
        if (port || event.source !== window.parent || event.data !== 'rin-connect' || !event.ports[0]) return;
        port = event.ports[0];
        port.onmessage = handle;
        port.start();
        send('ready');
      });
      window.parent.postMessage('rin-runner-ready', '*');
    }

    function runnerDocument() {
      const css = `
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
        body { display: flex; align-items: center; justify-content: center; }
        canvas { display: block !important; max-width: 95vw !important; max-height: 86vh !important;
          width: auto !important; height: auto !important; object-fit: contain; border-radius: 16px;
          box-shadow: 0 24px 70px rgba(0, 0, 0, .85), 0 0 1px rgba(255, 255, 255, .25); }
      `;
      return '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<style>' + css + '</style>' +
        '<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.5/p5.min.js"></' + 'script>' +
        '</head><body><script>(' + sketchRunner.toString() + ')();</' + 'script></body></html>';
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 2500);
    }

    function base64UrlToBytes(base64url) {
      if (base64url.length > 300000 || !/^[A-Za-z0-9_-]+$/.test(base64url)) {
        throw new Error('Invalid or oversized sketch link');
      }
      let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function decompress(bytes) {
      if (typeof pako !== 'undefined' && typeof pako.inflate === 'function') {
        try {
          return pako.inflate(bytes, { to: 'string' });
        } catch (_) {
          return pako.inflateRaw(bytes, { to: 'string' });
        }
      }
      if (typeof DecompressionStream !== 'undefined') {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        return new Response(stream).text();
      }
      throw new Error('No decompression method available.');
    }

    async function compressedSketchUrl(code) {
      const source = new TextEncoder().encode(code);
      let compressed;
      if (typeof pako !== 'undefined' && typeof pako.deflate === 'function') {
        compressed = pako.deflate(source, { level: 9 });
      } else if (typeof CompressionStream !== 'undefined') {
        const stream = new Blob([source]).stream().pipeThrough(new CompressionStream('deflate'));
        compressed = new Uint8Array(await new Response(stream).arrayBuffer());
      } else {
        throw new Error('Link compression is unavailable');
      }
      let base64 = '';
      for (let offset = 0; offset < compressed.length; offset += 0x8000) {
        base64 += String.fromCharCode(...compressed.subarray(offset, offset + 0x8000));
      }
      const encoded = btoa(base64).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (encoded.length > 300000) throw new Error('Sketch is too large for a share link');
      const url = new URL(window.location.href);
      const params = new URLSearchParams(url.hash.substring(1) || url.search);
      const hideSource = params.get('src') === '0';
      url.searchParams.delete('code');
      url.searchParams.delete('c');
      url.hash = `c=${encoded}${hideSource ? '&src=0' : ''}`;
      return url.href;
    }

    async function refreshShareUrl(code) {
      try {
        const url = await compressedSketchUrl(code);
        if (globalCode === code) window.history.replaceState(null, '', url);
      } catch (error) {
        showToast(error.message || 'Could not update share link');
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function sendRunner(type, extra = {}) {
      runnerPort?.postMessage({ type, ...extra });
    }

    function updateParam(name, value) {
      window.rinParams[name] = value;
      sendRunner('params', { params: { [name]: value } });
    }

    function downloadBlob(blob, type, kind) {
      if (!blob || typeof blob.size !== 'number' || !blob.size) {
        showToast('No media data was captured');
        return;
      }
      try {
        const extension = kind === 'snapshot' ? 'png' : type?.startsWith('video/mp4') ? 'mp4' : 'webm';
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `rin-${kind === 'snapshot' ? 'snapshot' : 'animation'}-${Date.now()}.${extension}`;
        document.body.appendChild(link);
        showToast(kind === 'snapshot' ? 'Snapshot saved' : 'Video downloaded');
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (_) {
        showToast('Media download failed');
      }
    }

    function onRunnerMessage(event) {
      const data = event.data || {};
      if (data.type === 'ready') {
        clearTimeout(runnerTimer);
        sendRunner('start', { code: globalCode, params: window.rinParams });
      } else if (data.type === 'started') {
        document.getElementById('loading-indicator').style.display = 'none';
      } else if (data.type === 'error') {
        document.getElementById('loading-indicator').style.display = 'none';
        showToast('Sketch error: ' + String(data.message || 'Unknown error').slice(0, 160));
      } else if (data.type === 'recording') {
        isRecording = !!data.active;
        const button = document.getElementById('btn-record');
        button.classList.toggle('recording', isRecording);
        button.setAttribute('aria-label', isRecording ? 'Stop recording' : 'Record five second video');
      } else if (data.type === 'download') {
        downloadBlob(data.blob, data.mediaType, data.kind);
      }
    }

    window.addEventListener('message', event => {
      if (event.source !== runnerFrame?.contentWindow || event.data !== 'rin-runner-ready' || runnerPort) return;
      const channel = new MessageChannel();
      runnerPort = channel.port1;
      runnerPort.onmessage = onRunnerMessage;
      runnerPort.start();
      runnerFrame.contentWindow.postMessage('rin-connect', '*', [channel.port2]);
    });

    function parseRinParams(code) {
      const values = Object.create(null);
      const descriptors = [];
      const regex = /^\s*\/\/\s*@rin\s+(number|color|boolean)\s+([A-Za-z_$][\w$]*)(?:\s+"([^"]{1,40})")?\s*(.*?)\s*$/gm;
      let match;
      while ((match = regex.exec(code)) !== null) {
        const type = match[1];
        const name = match[2];
        const label = match[3] || name;
        const rest = (match[4] || '').trim().split(/\s+/);
        if (type === 'number') {
          let min = 0, max = 100, def = 0, step = 1;
          if (rest.length >= 4) {
            min = Number(rest[0]);
            max = Number(rest[1]);
            def = Number(rest[2]);
            step = Number(rest[3]);
          } else if (rest.length === 1 && rest[0] !== '') {
            def = Number(rest[0]);
            max = def > 0 ? def * 2 : 100;
          }
          if ([min, max, def, step].every(Number.isFinite) && min <= max && step > 0 && def >= min && def <= max) {
            values[name] = def;
            descriptors.push({ type, name, label, default: def, min, max, step });
          }
        } else if (type === 'boolean') {
          const val = rest[0]?.toLowerCase() === 'true';
          values[name] = val;
          descriptors.push({ type, name, label, default: val });
        } else if (type === 'color') {
          const val = /^#[0-9a-fA-F]{6}$/.test(rest[0]) ? rest[0] : '#00E5FF';
          values[name] = val;
          descriptors.push({ type, name, label, default: val });
        }
      }
      return { values, descriptors };
    }

    function setupParamsUi(descriptors) {
      const btnParams = document.getElementById('btn-params');
      const paramsList = document.getElementById('params-list');
      const countEl = document.getElementById('params-count');
      paramsList.replaceChildren();

      if (!descriptors || descriptors.length === 0) {
        btnParams.style.display = 'none';
        btnParams.classList.remove('active');
        btnParams.setAttribute('aria-expanded', 'false');
        document.getElementById('params-panel').classList.remove('visible');
        if (countEl) countEl.textContent = '0';
        return;
      }

      btnParams.style.display = 'flex';
      if (countEl) countEl.textContent = descriptors.length;

      descriptors.forEach(desc => {
        const item = document.createElement('div');
        item.className = 'param-item';

        if (desc.type === 'number') {
          item.innerHTML = `
            <div class="param-title-row">
              <div>
                <div class="param-label">${escapeHtml(desc.label)}</div>
                <div class="param-var">rinParams.${escapeHtml(desc.name)}</div>
              </div>
              <span class="param-val" id="val-${desc.name}">${desc.default}</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="panel-btn" aria-label="Decrease ${escapeHtml(desc.label)}" id="dec-${desc.name}" style="padding:2px 8px; font-weight:bold;">−</button>
              <input type="range" aria-label="${escapeHtml(desc.label)}" min="${desc.min}" max="${desc.max}" step="${desc.step}" value="${desc.default}" id="input-${desc.name}" style="flex:1;">
              <button class="panel-btn" aria-label="Increase ${escapeHtml(desc.label)}" id="inc-${desc.name}" style="padding:2px 8px; font-weight:bold;">+</button>
            </div>
            <div style="font-size:11px; color:var(--text-dim); display:flex; justify-content:space-between;">
              <span>${desc.min} .. ${desc.max}</span>
              <span>step: ${desc.step}</span>
            </div>
          `;
          paramsList.appendChild(item);

          const slider = item.querySelector(`#input-${desc.name}`);
          const valDisplay = item.querySelector(`#val-${desc.name}`);
          const btnDec = item.querySelector(`#dec-${desc.name}`);
          const btnInc = item.querySelector(`#inc-${desc.name}`);

          const updateNum = (val) => {
            const clamped = Math.max(desc.min, Math.min(desc.max, val));
            const decimals = String(desc.step).includes('.') ? String(desc.step).split('.')[1].length : 0;
            const formatted = decimals > 0 ? Number(clamped.toFixed(decimals)) : Math.round(clamped);
            slider.value = formatted;
            valDisplay.textContent = formatted;
            updateParam(desc.name, formatted);
          };

          slider.addEventListener('input', () => updateNum(Number(slider.value)));
          btnDec.addEventListener('click', () => updateNum(Number(slider.value) - desc.step));
          btnInc.addEventListener('click', () => updateNum(Number(slider.value) + desc.step));

        } else if (desc.type === 'boolean') {
          item.innerHTML = `
            <div class="toggle-row">
              <div>
                <div class="param-label">${escapeHtml(desc.label)}</div>
                <div class="param-var">rinParams.${escapeHtml(desc.name)}</div>
              </div>
              <label class="switch">
                <input type="checkbox" aria-label="${escapeHtml(desc.label)}" ${desc.default ? 'checked' : ''} id="input-${desc.name}">
                <span class="slider-toggle"></span>
              </label>
            </div>
          `;
          paramsList.appendChild(item);
          const toggle = item.querySelector(`#input-${desc.name}`);
          toggle.addEventListener('change', () => {
            updateParam(desc.name, toggle.checked);
          });

        } else if (desc.type === 'color') {
          item.innerHTML = `
            <div class="toggle-row">
              <div>
                <div class="param-label">${escapeHtml(desc.label)}</div>
                <div class="param-var">rinParams.${escapeHtml(desc.name)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="param-val" id="val-${desc.name}">${desc.default}</span>
                <input type="color" aria-label="${escapeHtml(desc.label)}" value="${desc.default}" id="input-${desc.name}" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--border-glass); cursor:pointer; background:none; padding:0;">
              </div>
            </div>
          `;
          paramsList.appendChild(item);
          const colorInput = item.querySelector(`#input-${desc.name}`);
          const valDisplay = item.querySelector(`#val-${desc.name}`);
          colorInput.addEventListener('input', () => {
            const hex = colorInput.value.toUpperCase();
            valDisplay.textContent = hex;
            updateParam(desc.name, hex);
          });
        }
      });

      const btnReset = document.getElementById('btn-reset-params');
      if (btnReset) {
        btnReset.onclick = () => {
          descriptors.forEach(desc => {
            updateParam(desc.name, desc.default);
            const input = document.getElementById(`input-${desc.name}`);
            const valDisplay = document.getElementById(`val-${desc.name}`);
            if (input) {
              if (desc.type === 'number') {
                input.value = desc.default;
                if (valDisplay) valDisplay.textContent = desc.default;
              } else if (desc.type === 'boolean') {
                input.checked = desc.default;
              } else if (desc.type === 'color') {
                input.value = desc.default;
                if (valDisplay) valDisplay.textContent = desc.default;
              }
            }
          });
          showToast('Reset all parameters');
        };
      }
    }

    function runSketch(code) {
      const parsed = parseRinParams(code);
      window.rinParams = parsed.values;
      setupParamsUi(parsed.descriptors);
      clearTimeout(runnerTimer);
      runnerPort?.close();
      runnerPort = null;
      runnerFrame?.remove();
      isRecording = false;
      document.getElementById('btn-record').classList.remove('recording');
      document.getElementById('loading-indicator').style.display = 'flex';
      runnerFrame = document.createElement('iframe');
      runnerFrame.id = 'sketch-frame';
      runnerFrame.title = 'Interactive sketch';
      runnerFrame.setAttribute('sandbox', 'allow-scripts');
      runnerFrame.srcdoc = runnerDocument();
      document.getElementById('sketch-host').appendChild(runnerFrame);
      runnerTimer = setTimeout(() => {
        document.getElementById('loading-indicator').style.display = 'none';
        showToast('Sketch runner could not be loaded');
      }, 12000);
      isRunning = true;
      document.getElementById('icon-pause').style.display = 'block';
      document.getElementById('icon-play').style.display = 'none';
      document.getElementById('btn-playpause').classList.remove('active');
      document.getElementById('btn-playpause').setAttribute('aria-label', 'Pause sketch');
    }

    function setupControls(allowCodeView = true) {
      const bar = document.getElementById('control-bar');
      bar.style.display = 'flex';

      const btnPlayPause = document.getElementById('btn-playpause');
      const iconPause = document.getElementById('icon-pause');
      const iconPlay = document.getElementById('icon-play');
      const btnRestart = document.getElementById('btn-restart');
      const btnSnapshot = document.getElementById('btn-snapshot');
      const btnRecord = document.getElementById('btn-record');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const btnParams = document.getElementById('btn-params');
      const paramsPanel = document.getElementById('params-panel');
      const btnCloseParams = document.getElementById('btn-close-params');
      const btnCode = document.getElementById('btn-code');
      const codeModal = document.getElementById('code-modal');
      const btnCloseCode = document.getElementById('btn-close-code');
      const btnCopy = document.getElementById('btn-copy');
      const copyText = document.getElementById('copy-text');
      const btnRun = document.getElementById('btn-run');
      const codeEditor = document.getElementById('code-editor');
      const codeLines = document.getElementById('code-lines');
      const btnShare = document.getElementById('btn-share');

      // Play / Pause
      btnPlayPause.addEventListener('click', () => {
        if (isRunning) {
          sendRunner('pause');
          isRunning = false;
          iconPause.style.display = 'none';
          iconPlay.style.display = 'block';
          btnPlayPause.classList.add('active');
          btnPlayPause.setAttribute('aria-label', 'Play sketch');
        } else {
          sendRunner('play');
          isRunning = true;
          iconPause.style.display = 'block';
          iconPlay.style.display = 'none';
          btnPlayPause.classList.remove('active');
          btnPlayPause.setAttribute('aria-label', 'Pause sketch');
        }
      });

      // Restart
      btnRestart.addEventListener('click', () => {
        btnRestart.style.transform = 'rotate(360deg)';
        setTimeout(() => { btnRestart.style.transform = ''; }, 320);
        runSketch(globalCode);
        showToast('Restarted sketch');
      });

      // Snapshot (PNG)
      btnSnapshot.addEventListener('click', () => {
        sendRunner('snapshot');
      });

      // Video Recording (WebM, 5s)
      if (btnRecord) {
        btnRecord.addEventListener('click', () => {
          sendRunner('record');
          if (!isRecording) showToast('Recording (5 seconds)...');
        });
      }

      // Share Link
      if (btnShare) {
        btnShare.addEventListener('click', async () => {
          let url;
          try {
            url = await compressedSketchUrl(globalCode);
          } catch (error) {
            showToast(error.message || 'Could not create share link');
            return;
          }
          if (navigator.share) {
            try {
              await navigator.share({
                title: 'Edit:RiN Web Sketch',
                text: 'Check out this generative art sketch on Edit:RiN Web Viewer!',
                url: url
              });
              return;
            } catch (_) {}
          }
          try {
            await navigator.clipboard.writeText(url);
            showToast('Share link copied');
          } catch (_) {
            showToast('Failed to copy link');
          }
        });
      }

      // Fullscreen
      if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        });
      }

      // Parameters Panel Toggle
      btnParams.addEventListener('click', () => {
        const visible = paramsPanel.classList.toggle('visible');
        btnParams.classList.toggle('active', visible);
        btnParams.setAttribute('aria-expanded', String(visible));
      });
      btnCloseParams.addEventListener('click', () => {
        paramsPanel.classList.remove('visible');
        btnParams.classList.remove('active');
        btnParams.setAttribute('aria-expanded', 'false');
        btnParams.focus();
      });

      // Code Editor & Viewer
      if (!allowCodeView) {
        if (btnCode) btnCode.style.display = 'none';
        if (codeModal) codeModal.remove();
      } else {
        const updateLineNumbers = () => {
          const count = codeEditor.value.split('\n').length;
          codeLines.innerHTML = Array.from({ length: count }, (_, i) => i + 1).join('<br>');
        };

        codeEditor.addEventListener('input', updateLineNumbers);
        codeEditor.addEventListener('scroll', () => {
          codeLines.scrollTop = codeEditor.scrollTop;
        });

        // Tab key support in editor
        codeEditor.addEventListener('keydown', (e) => {
          if (e.key === 'Tab' && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            const start = codeEditor.selectionStart;
            const end = codeEditor.selectionEnd;
            codeEditor.value = codeEditor.value.substring(0, start) + '  ' + codeEditor.value.substring(end);
            codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
            updateLineNumbers();
          }
        });

        btnCode.addEventListener('click', () => {
          codeEditor.value = globalCode;
          updateLineNumbers();
          codeModal.classList.add('visible');
          btnCode.classList.add('active');
          btnCode.setAttribute('aria-expanded', 'true');
          codeEditor.focus();
        });

        const closeModal = () => {
          codeModal.classList.remove('visible');
          btnCode.classList.remove('active');
          btnCode.setAttribute('aria-expanded', 'false');
          btnCode.focus();
        };

        btnCloseCode.addEventListener('click', closeModal);
        codeModal.addEventListener('click', (e) => {
          if (e.target === codeModal) closeModal();
        });
        codeModal.addEventListener('keydown', (e) => {
          if (e.key !== 'Tab') return;
          const focusable = [btnRun, btnCopy, btnCloseCode, codeEditor];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        });

        // Copy Code
        btnCopy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(codeEditor.value);
            copyText.textContent = 'Copied!';
            showToast('Code copied to clipboard');
            setTimeout(() => { copyText.textContent = 'Copy'; }, 1800);
          } catch (_) {
            showToast('Failed to copy');
          }
        });

        // Run Code Button
        btnRun.addEventListener('click', () => {
          globalCode = codeEditor.value;
          runSketch(globalCode);
          refreshShareUrl(globalCode);
          closeModal();
          showToast('Starting sketch');
        });
      }

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (codeModal && codeModal.classList.contains('visible')) {
            codeModal.classList.remove('visible');
            btnCode?.classList.remove('active');
            btnCode?.setAttribute('aria-expanded', 'false');
            btnCode?.focus();
          }
          if (paramsPanel.classList.contains('visible')) {
            paramsPanel.classList.remove('visible');
            btnParams.classList.remove('active');
            btnParams.setAttribute('aria-expanded', 'false');
            btnParams.focus();
          }
        } else if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          btnPlayPause.click();
        }
      });

      // Auto-hide controls on inactivity
      function resetActivityTimer() {
        bar.style.opacity = '1';
        bar.style.transform = 'translateX(-50%) translateY(0)';
        document.getElementById('top-bar').style.opacity = '1';
        clearTimeout(autoHideTimer);
        autoHideTimer = setTimeout(() => {
          const isCodeModalVisible = codeModal && codeModal.parentElement && codeModal.classList.contains('visible');
          const controlsFocused = bar.contains(document.activeElement) ||
            document.getElementById('top-bar').contains(document.activeElement);
          if (!paramsPanel.classList.contains('visible') && !isCodeModalVisible && !controlsFocused) {
            bar.style.opacity = '0';
            bar.style.transform = 'translateX(-50%) translateY(14px)';
            document.getElementById('top-bar').style.opacity = '0';
          }
        }, 3600);
      }
      window.addEventListener('mousemove', resetActivityTimer);
      window.addEventListener('touchstart', resetActivityTimer);
      window.addEventListener('focusin', resetActivityTimer);
      resetActivityTimer();
    }

    async function startViewer() {
      const loading = document.getElementById('loading-indicator');
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash || window.location.search);
      const encodedCode = params.get('c') || params.get('code');
      const allowCodeView = params.get('src') !== '0';

      if (!encodedCode) {
        globalCode = DEMO_SKETCH;
        runSketch(globalCode);
        setupControls(true);
        const notice = document.getElementById('banner-notice');
        if (notice) {
          notice.textContent = '✨ Interactive Demo Sketch';
          notice.style.display = 'flex';
          setTimeout(() => { notice.style.display = 'none'; }, 4000);
        }
        return;
      }

      try {
        const bytes = base64UrlToBytes(encodedCode);
        const code = await decompress(bytes);
        globalCode = code;

        runSketch(globalCode);
        setupControls(allowCodeView);

      } catch (err) {
        if (loading) loading.style.display = 'none';
        showToast('Error loading sketch: ' + (err.message || String(err)));
        globalCode = DEMO_SKETCH;
        runSketch(globalCode);
        setupControls(true);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startViewer);
    } else {
      startViewer();
    }
    window.addEventListener('hashchange', () => window.location.reload());
  </script>
</body>
