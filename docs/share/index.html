<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Edit:RiN Web Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0F111A;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #top-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1000;
    }
    .badge {
      pointer-events: auto;
      background: rgba(15, 17, 26, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #A8C7FA;
      text-decoration: none;
      transition: background 0.2s;
    }
    .badge:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    canvas {
      display: block !important;
      max-width: 95vw !important;
      max-height: 90vh !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
    }
    #loading-indicator {
      position: fixed;
      font-size: 13px;
      color: #7E8294;
      letter-spacing: 0.08em;
      pointer-events: none;
    }
    #error-msg {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 500px;
      background: rgba(239, 68, 68, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 16px 20px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      z-index: 2000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
  </style>

  <!-- pako for universal zero-dependency inflate support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.5/p5.min.js"></script>
</head>
<body>
  <div id="top-bar">
    <span class="badge">Edit:RiN</span>
    <a class="badge" href="https://github.com/rin-code-dev/Edit-RiN" target="_blank" rel="noopener">GitHub</a>
  </div>

  <div id="loading-indicator">LOADING SKETCH...</div>
  <div id="error-msg"></div>

  <script>
    function base64UrlToBytes(base64url) {
      let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function decompress(bytes) {
      // 1. Try pako inflate (works everywhere, synchronous & fast)
      if (typeof pako !== 'undefined' && typeof pako.inflate === 'function') {
        try {
          return pako.inflate(bytes, { to: 'string' });
        } catch (e) {
          // If zlib header is missing, try raw inflate
          return pako.inflateRaw(bytes, { to: 'string' });
        }
      }

      // 2. Fallback to native DecompressionStream
      if (typeof DecompressionStream !== 'undefined') {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        return new Response(stream).text();
      }

      throw new Error('No decompression method available.');
    }

    function parseRinParams(code) {
      const params = Object.create(null);
      const regex = /\/\/\s*@rin\s+(number|boolean|color)\s+([a-zA-Z0-9_]+)(?:\s+([^\n\r]+))?/g;
      let match;
      while ((match = regex.exec(code)) !== null) {
        const type = match[1];
        const name = match[2];
        const rest = (match[3] || '').trim().split(/\s+/);
        if (type === 'number') {
          params[name] = Number(rest[0]) || 0;
        } else if (type === 'boolean') {
          params[name] = rest[0] !== 'false';
        } else if (type === 'color') {
          params[name] = rest[0] || '#ffffff';
        }
      }
      return params;
    }

    async function startViewer() {
      const loading = document.getElementById('loading-indicator');
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash || window.location.search);
      const encodedCode = params.get('c') || params.get('code');

      if (!encodedCode) {
        if (loading) loading.style.display = 'none';
        showError('No sketch code found in URL.\nUsage: .../share/#c=<code_data>');
        return;
      }

      try {
        const bytes = base64UrlToBytes(encodedCode);
        const code = await decompress(bytes);

        if (loading) loading.style.display = 'none';

        // Provide default rinParams support
        window.rinParams = parseRinParams(code);

        // Inject sketch code into page
        const script = document.createElement('script');
        script.textContent = `${code}\n//# sourceURL=sketch.js`;
        document.body.appendChild(script);

        // Explicitly start p5 in global mode if not already started
        if (typeof p5 !== 'undefined') {
          new p5();
        }
      } catch (err) {
        if (loading) loading.style.display = 'none';
        showError('Failed to load sketch:\n' + (err.message || String(err)));
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      if (el) {
        el.textContent = msg;
        el.style.display = 'block';
      }
    }

    // Start on DOM ready or immediate if already loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startViewer);
    } else {
      startViewer();
    }
  </script>
</body>
</html>
