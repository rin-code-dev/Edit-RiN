name: Build Debug APK
run-name: Cloud debug ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request identifier
        required: true
      source_sha:
        description: Immutable source commit
        required: true
      run_tests:
        description: Run unit tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/cloud-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Prepare SDK and persistent debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.CLOUD_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Debug signing secret is missing'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          chmod +x android/gradlew
      - name: Build in the cloud
        working-directory: android
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          tasks=(assembleDebug)
          if [ "$RUN_TESTS" = true ]; then tasks+=(testDebugUnitTest); fi
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace --max-workers=4 \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Prepare verified artifact
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir cloud-output
          cp android/app/build/outputs/apk/debug/app-debug.apk cloud-output/
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs cloud-output/app-debug.apk
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -file "$RUNNER_TEMP/cloud-debug-cert.der"
          python3 - <<'PYTHON'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          apk = Path('cloud-output/app-debug.apk')
          expected = hashlib.sha256(Path(os.environ['RUNNER_TEMP'], 'cloud-debug-cert.der').read_bytes()).hexdigest()
          tool = Path(os.environ['ANDROID_HOME'], 'build-tools/37.0.0/apksigner')
          certificates = subprocess.check_output([str(tool), 'verify', '--print-certs', str(apk)], text=True)
          actual = re.search(r'certificate SHA-256 digest: ([a-f0-9]+)', certificates).group(1)
          if actual != expected:
              raise RuntimeError('APK signing certificate differs from the configured debug key')
          info = dict(source_sha=os.environ['SOURCE_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                      sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), signer_sha256=actual)
          Path('cloud-output/build.json').write_text(json.dumps(info, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Edit-RiN-Dev-${{ github.run_id }}
          path: cloud-output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload test reports
        if: always() && inputs.run_tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove debug key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
