  <main id="editor" aria-label="Block editor">
    <header id="tools">
      <button id="paletteToggle" class="tonal" type="button" aria-expanded="false" aria-controls="palette"><svg class="icon"><use href="#i-add"/></svg><span class="label" id="paletteToggleLabel">追加</span></button>
      <button id="undo" class="icon-button" type="button" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button id="redo" class="icon-button" type="button" aria-label="Redo"><svg class="icon"><use href="#i-redo"/></svg></button>
      <span class="spacer"></span>
      <button id="workspaceSearch" class="icon-button" type="button" aria-label="作品内を探す"><svg class="icon"><use href="#i-search"/></svg></button>
      <button id="codePreview" class="icon-button secondary-tool" type="button" aria-label="コードプレビュー" title="コードプレビュー"><svg class="icon"><use href="#i-code"/></svg></button>
      <button id="fit" class="icon-button secondary-tool" type="button" aria-label="Fit blocks"><svg class="icon"><use href="#i-fit"/></svg></button>
      <button id="fullscreen" class="icon-button" type="button" aria-pressed="false"><svg class="icon"><use href="#i-fullscreen"/></svg><span class="sr-only" id="fullscreenLabel">全画面</span></button>
      <button id="more" class="icon-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu"><svg class="icon"><use href="#i-more"/></svg></button>
    </header>
    <div id="moreMenu" class="menu" role="menu" hidden>
      <button id="menuModeToggle" type="button" role="menuitem"><svg class="icon"><use href="#i-tune"/></svg><span id="menuModeToggleLabel"></span></button>
      <button id="menuCodePreview" class="compact-action" type="button" role="menuitem"><svg class="icon"><use href="#i-code"/></svg><span id="menuCodePreviewLabel"></span></button>
      <button id="menuFit" class="compact-action" type="button" role="menuitem"><svg class="icon"><use href="#i-fit"/></svg><span id="menuFitLabel"></span></button>
      <button id="outline" type="button" role="menuitem"><svg class="icon"><use href="#i-items"/></svg><span id="outlineLabel"></span></button>
      <button id="displaySettings" type="button" role="menuitem"><svg class="icon"><use href="#i-display"/></svg><span id="displaySettingsLabel"></span></button>
      <button id="examples" type="button" role="menuitem"><svg class="icon"><use href="#i-snippet"/></svg><span id="examplesLabel">Examples</span></button>
      <button id="zoomReset" type="button" role="menuitem"><svg class="icon"><use href="#i-zoom-reset"/></svg><span id="zoomResetLabel">100%</span></button>
      <button id="runtime" type="button" role="menuitem"><svg class="icon"><use href="#i-settings"/></svg><span id="runtimeLabel">Runtime settings</span></button>
      <button id="help" type="button" role="menuitem"><svg class="icon"><use href="#i-help"/></svg><span id="helpLabel">Help</span></button>
    </div>
    <div id="statusArea">
      <p id="status" role="status" aria-live="polite">Connecting…</p>
      <button id="partsBadge" type="button" hidden></button>
      <button id="statusDismiss" type="button" hidden aria-label="閉じる">×</button>
    </div>
    <div id="workspaceArea">
      <div id="workspace" aria-label="JavaScript blocks"></div>
      <div id="blockActions" role="toolbar" hidden></div>
    </div>
    <div id="sheetScrim" hidden></div>
    <aside id="palette" hidden aria-label="Blocks">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div class="search-field">
          <svg class="icon"><use href="#i-search"/></svg>
          <label id="searchLabel" for="search" class="sr-only">Search blocks</label>
          <input id="search" type="search" autocomplete="off" spellcheck="false">
        </div>
        <button id="paletteClose" class="icon-button" type="button"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="paletteTargetBar" class="palette-target-bar" hidden>
        <span id="paletteTargetLabel" class="palette-target-label"></span>
        <button id="paletteTargetModeBtn" class="palette-target-mode-btn" type="button"></button>
      </div>
      <div id="categories" role="group" aria-label="Categories"></div>
      <div id="paletteItems"></div>
    </aside>
    <dialog id="actionDialog"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogDescription"></p><div id="dialogChoices"></div><div class="dialog-actions"><button id="dialogCancel" class="text-button" type="submit" value="cancel">Cancel</button></div></form></dialog>
    <dialog id="navigatorDialog" class="navigator-dialog" aria-labelledby="navigatorTitle">
      <h2 id="navigatorTitle"></h2>
      <div id="navigatorTabs" class="navigator-tabs" role="tablist"></div>
      <label id="navigatorSearchLabel" class="sr-only" for="navigatorSearch"></label>
      <input id="navigatorSearch" type="search" autocomplete="off" spellcheck="false">
      <p id="navigatorHint"></p>
      <div id="navigatorResults"></div>
      <div class="dialog-actions"><button id="navigatorClose" type="button" class="text-button"></button></div>
    </dialog>
    <dialog id="codeDialog" class="code-dialog">
      <div class="code-dialog-header">
        <div class="code-dialog-title-group">
          <h2 id="codeDialogTitle">JavaScript コードプレビュー</h2>
          <p id="codeDialogSubtitle" class="code-dialog-sub"></p>
        </div>
        <button id="codeDialogClose" class="icon-button" type="button" aria-label="閉じる"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="codeScopeToggle" class="code-scope-toggle" hidden>
        <button id="codeScopeBlock" type="button" class="scope-button" aria-pressed="true">選択ブロック</button>
        <button id="codeScopeAll" type="button" class="scope-button" aria-pressed="false">作品全体</button>
      </div>
      <div class="code-container">
        <pre><code id="codeDialogContent"></code></pre>
      </div>
      <div class="dialog-actions code-dialog-actions">
        <button id="codeDialogCopy" class="text-button" type="button"><svg class="icon"><use href="#i-duplicate"/></svg><span>コピー</span></button>
        <button id="codeDialogJump" class="text-button" type="button">テキストで編集</button>
        <button id="codeDialogDone" class="filled" type="button">閉じる</button>
      </div>
    </dialog>
    <div id="announcement" class="sr-only" role="alert" aria-live="assertive"></div>
  </main>
</body>
</html>
